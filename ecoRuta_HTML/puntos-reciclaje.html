<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRuta - Puntos de Reciclaje</title>

    <!-- Leaflet: librería del mapa interactivo (su CSS va ANTES que el nuestro) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="diseño.css">
</head>

<body>

    <!-- Barra de navegación -->
    <header>
        <nav>

            <a href="index.html">EcoRuta</a>

            <div>
                <a href="index.html">Inicio</a>
                <a href="puntos-reciclaje.html">Puntos de reciclaje</a>
                <a href="campanas.html">Campañas</a>
                <a href="registrar-punto.html">Registrar un punto</a>
                <a href="unirse.html">Unirse</a>
            </div>

        </nav>
    </header>


    <!-- Contenido principal -->
    <main>

        <!-- Título -->
        <section class="encabezado">

            <h1>Puntos de Reciclaje</h1>

        </section>


        <!-- Filtros: data-categoria debe coincidir con las categorías de datos.js -->
        <section class="filtros">

            <button data-categoria="Todo" class="activo">Todo</button>
            <button data-categoria="Papel">Papel</button>
            <button data-categoria="Plástico">Plástico</button>
            <button data-categoria="Vidrio">Vidrio</button>
            <button data-categoria="Metal">Metal</button>
            <button data-categoria="Electrónicos">Electrónicos</button>

        </section>


        <!-- Mensaje de estado (cuántos puntos hay o si no hay resultados) -->
        <p id="estado" role="status"></p>


        <!-- Mapa interactivo: puntos.js lo dibuja aquí. Necesita una altura definida en el CSS -->
        <div id="mapa"></div>


        <!-- Tarjetas: puntos.js crea una por cada punto de datos.js -->
        <section class="puntos" id="lista-puntos"></section>

    </main>


    <!-- Pie de página -->
    <footer>

        <h3>EcoRuta</h3>

        <p>
            © 2024 EcoRuta. Todos los derechos reservados.
            Compromiso con el reciclaje comunitario.
        </p>

        <div>
            <a href="#">Privacidad</a>
            <a href="#">Términos de Servicio</a>
            <a href="#">Contacto</a>
            <a href="#">Mapa del Sitio</a>
        </div>

    </footer>

    <script src="app.js"></script>
    <!-- Leaflet define la variable global L; debe cargarse antes que puntos.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- puntos.js es un módulo: importa datos.js. Ábrelo con Live Server -->
    <script type="module" src="puntos.js"></script>
</body>

</html>
